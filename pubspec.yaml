  intl: ^0.20.2
  uuid: ^4.6.0
  logger: ^2.7.0
  equatable: ^2.1.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0

flutter:

  generate: true

